<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>計算機</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .calculator {
            width: 320px;
            background: #000;
            padding: 20px;
            box-sizing: border-box;
        }
        .display-container {
            width: 100%;
            height: 100px;
            background: #000;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            overflow: hidden;
        }
        #display {
            background: #000;
            color: #fff;
            font-size: 80px;
            border: none;
            outline: none;
            text-align: right;
            width: 100%;
            padding: 0;
            white-space: nowrap;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        button {
            background-color: #333;
            color: #fff;
            font-size: 32px;
            border: none;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
            user-select: none;
        }
        button:active {
            background-color: #737373;
        }
        .gray {
            background-color: #a6a6a6;
            color: #000;
        }
        .gray:active {
            background-color: #d9d9d9;
        }
        .orange {
            background-color: #ff9f0a;
        }
        .orange:active {
            background-color: #ffb340;
        }
        .zero {
            grid-column: span 2;
            width: 145px;
            border-radius: 35px;
            justify-content: flex-start;
            padding-left: 25px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display-container">
        <input type="text" id="display" value="0" readonly>
    </div>
    <div class="buttons">
        <button class="gray" onclick="clearDisplay()">AC</button>
        <button class="gray" onclick="appendValue('+/-')">+/-</button>
        <button class="gray" onclick="appendValue('%')">%</button>
        <button class="orange" onclick="appendValue('÷')">÷</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="orange" onclick="appendValue('×')">×</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="orange" onclick="appendValue('-')">-</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="orange" onclick="appendValue('+')">+</button>
        
        <button class="zero" onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="orange" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let currentInput = "0";
    let expression = "";
    
    // 魔術狀態變數
    let magicActive = false; 
    let magicStage = 0;      // 0: 準備出第一組, 1: 準備出第二組
    
    // AC 點擊計時與計數控制
    let lastAcTime = 0;
    
    const magicNumbers = [
        "5201314", // 第一次按等於
        "5203344"  // 第二次按等於
    ];

    function updateDisplay() {
        let display = document.getElementById('display');
        display.value = currentInput;
        
        let length = currentInput.length;
        if (length <= 6) {
            display.style.fontSize = "80px";
        } else if (length <= 9) {
            display.style.fontSize = "60px";
        } else if (length <= 12) {
            display.style.fontSize = "45px";
        } else {
            display.style.fontSize = "32px";
        }
    }

    function appendValue(val) {
        if (currentInput === "0" && val !== '.') {
            currentInput = val;
        } else {
            currentInput += val;
        }
        expression += val;
        updateDisplay();
    }

    function clearDisplay() {
        let now = new Date().getTime();
        
        // 如果在 400 毫秒內又按了一次 AC，判定為「連按兩次」，關閉魔術（變回正常計算機）
        if (now - lastAcTime < 400) {
            magicActive = false;
            magicStage = 0;
            if (navigator.vibrate) navigator.vibrate(30); // 震一下代表切回正常模式
        } else {
            // 只按了一次 AC：啟動魔術模式，並重置階段
            magicActive = true;
            magicStage = 0;
            if (navigator.vibrate) navigator.vibrate(60); // 震一下代表魔術已就緒
        }
        
        lastAcTime = now;
        currentInput = "0";
        expression = "";
        updateDisplay();
    }

    function calculate() {
        try {
            if (magicActive) {
                // 魔術模式：依序吐出預言數字
                if (magicStage === 0) {
                    currentInput = magicNumbers[0]; // 5201314
                    magicStage = 1;
                } else {
                    currentInput = magicNumbers[1]; // 5203344
                    magicStage = 0; // 循環或重置
                }
            } else {
                // 正常計算機模式
                let safeExp = expression.replace(/×/g, '*').replace(/÷/g, '/');
                let result = eval(safeExp);
                currentInput = String(result);
            }
            expression = currentInput;
            updateDisplay();
        } catch (error) {
            currentInput = "錯誤";
            updateDisplay();
        }
    }

    updateDisplay();
</script>

</body>
</html>
